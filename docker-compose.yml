# Hermes Agent — single lightweight service.
#
# Portable across machines (office laptop <-> home PC): mount data/ and
# credentials/ from a cloud-synced folder so state follows you. Do NOT run on
# two machines at once (SQLite is not multi-writer).
#
# Set HERMES_SYNC_DIR to your cloud-synced path, e.g.:
#   export HERMES_SYNC_DIR="$HOME/Library/Mobile Documents/com~apple~CloudDocs/hermes"
# Defaults to ./ (local) if unset.

services:
  hermes:
    build: .
    image: hermes-agent:latest
    container_name: hermes
    env_file: .env
    ports:
      - "127.0.0.1:${HERMES_PORT:-8000}:8000"
    volumes:
      - "${HERMES_SYNC_DIR:-./}/data:/app/data"
      - "${HERMES_SYNC_DIR:-./}/credentials:/app/credentials"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped
