      A2A_REPLY_TIMEOUT: "90"
      OFFICE_FAST_ROLE: llm-edge
      HERMES_DASHBOARD_PUBLIC_URL: http://${HERMES_BOT_BIND:-10.216.4.80}:9124
      HERMES_OFFLINE: "1"
      NPM_CONFIG_OFFLINE: "true"
      NPM_CONFIG_FETCH_TIMEOUT: "5000"
      NPM_CONFIG_FETCH_RETRIES: "0"
