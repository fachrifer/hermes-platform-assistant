      HERMES_API_TIMEOUT: "60"
      A2A_REPLY_TIMEOUT: "90"
      OFFICE_FAST_ROLE: lab-host
      HERMES_DASHBOARD_PUBLIC_URL: http://${HERMES_BOT_BIND:-10.216.4.80}:9121
      HERMES_OFFLINE: "1"
      NPM_CONFIG_OFFLINE: "true"
      NPM_CONFIG_FETCH_TIMEOUT: "5000"
      NPM_CONFIG_FETCH_RETRIES: "0"
      UV_OFFLINE: "1"
    volumes:
      - hermes_lab_host_data:/opt/data
      - ./hermes/lab-host/config.yaml:/opt/hermes-config.template.yaml:ro
      - ./scripts/apply-office-llm-config.py:/opt/office/apply-office-llm-config.py:ro
      - ./scripts/patch-hermes-airgap-provider.py:/opt/office/patch-hermes-airgap-provider.py:ro
      - ./scripts/office-gw-get.sh:/opt/office/office-gw-get.sh:ro
      - ./scripts/office-gw-fast.sh:/opt/office/office-gw-fast.sh:ro
      - ./scripts/office-gw-propose.sh:/opt/office/office-gw-propose.sh:ro
      - ./scripts/office-gw-watch.sh:/opt/office/office-gw-watch.sh:ro
      - ./scripts/office-watch-eval.py:/opt/office/office-watch-eval.py:ro
      - ./scripts/s6-office-watch-run:/etc/services.d/office-watch/run:ro
      - ./scripts/hermes-cli-symlink-cont-init.sh:/etc/cont-init.d/08-hermes-cli:ro
      - ./scripts/hermes-office-llm-cont-init.sh:/etc/cont-init.d/10-office-llm:ro
      - ./skills/lab-host:/opt/data/skills/lab-host:ro
    command: ["gateway", "run"]

  hermes-vector:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.31}
    restart: unless-stopped
    networks:
      - office
    depends_on:
