name: office

networks:
  office:
    driver: bridge

volumes:
  office_gateway_data:
  hermes_supervisor_data:
  kanban_data:
  hermes_lab_host_data:
  hermes_vector_data:
  hermes_cluster_gpu_data:
  hermes_llm_edge_data:
  hermes_obs_data:

services:
  office-gateway-init:
    image: busybox:1.36
    restart: "no"
    volumes:
      - office_gateway_data:/var/lib/hermes-office-gateway
      - ${OFFICE_KUBECONFIG:-./kubeconfig.absent}:/etc/office/kubeconfig:ro
    command:
      - sh
      - -c
      - |
        chown -R 10001:10001 /var/lib/hermes-office-gateway
        if [ -s /etc/office/kubeconfig ]; then
          cp /etc/office/kubeconfig /var/lib/hermes-office-gateway/kubeconfig
          chown 10001:10001 /var/lib/hermes-office-gateway/kubeconfig
          chmod 0640 /var/lib/hermes-office-gateway/kubeconfig
        fi

  office-gateway:
    build:
      context: ${OFFICE_GATEWAY_CONTEXT:-../..}
      dockerfile: Dockerfile.office-gateway
    image: office-gw:local
    restart: unless-stopped
    depends_on:
      office-gateway-init:
        condition: service_completed_successfully
    group_add:
      - "${DOCKER_GID:-998}"
    networks:
      - office
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - office_gateway_data:/var/lib/hermes-office-gateway
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      OFFICE_GATEWAY_BIND_HOST: 0.0.0.0
      OFFICE_GATEWAY_PORT: "8080"
      OFFICE_GATEWAY_DB_PATH: /var/lib/hermes-office-gateway/gateway.db
      KUBECONFIG: /var/lib/hermes-office-gateway/kubeconfig

  hermes-agent:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3}
    restart: unless-stopped
    networks:
      - office
    depends_on:
      - office-gateway
      - hermes-lab-host
      - hermes-vector
      - hermes-cluster-gpu
      - hermes-llm-edge
      - hermes-obs
    ports:
      - "${HERMES_DASHBOARD_PUBLISH:-10.216.4.80:9119}:9119"
    env_file:
      - ./hermes/supervisor/.env
      - ./models.env
    environment:
      HERMES_HOME: /opt/data
      OFFICE_GATEWAY_URL: http://office-gateway:8080
      HERMES_API_TIMEOUT: "60"
      A2A_REPLY_TIMEOUT: "90"
    volumes:
      - hermes_supervisor_data:/opt/data
      - kanban_data:/opt/data/kanban
      - ./hermes/supervisor/config.yaml:/opt/data/config.yaml:ro
      - ./skills/supervisor:/opt/data/skills/supervisor:ro
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open"]

  hermes-lab-host:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3}
    restart: unless-stopped
    networks:
      - office
    depends_on:
      - office-gateway
    env_file:
      - ./hermes/lab-host/.env
      - ./models.env
    environment:
      HERMES_HOME: /opt/data
      OFFICE_GATEWAY_URL: http://office-gateway:8080
      HERMES_API_TIMEOUT: "60"
      A2A_REPLY_TIMEOUT: "90"
    volumes:
      - hermes_lab_host_data:/opt/data
      - ./hermes/lab-host/config.yaml:/opt/hermes-config.template.yaml:ro
      - ./scripts/apply-office-llm-config.py:/opt/office/apply-office-llm-config.py:ro
      - ./scripts/hermes-office-llm-cont-init.sh:/etc/cont-init.d/10-office-llm:ro
      - ./skills/lab-host:/opt/data/skills/lab-host:ro
    command: ["gateway", "run"]

  hermes-vector:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3}
    restart: unless-stopped
    networks:
      - office
    depends_on:
      - office-gateway
    env_file:
      - ./hermes/vector/.env
      - ./models.env
    environment:
      HERMES_HOME: /opt/data
      OFFICE_GATEWAY_URL: http://office-gateway:8080
      HERMES_API_TIMEOUT: "60"
      A2A_REPLY_TIMEOUT: "90"
    volumes:
      - hermes_vector_data:/opt/data
      - ./hermes/vector/config.yaml:/opt/hermes-config.template.yaml:ro
      - ./scripts/apply-office-llm-config.py:/opt/office/apply-office-llm-config.py:ro
      - ./scripts/hermes-office-llm-cont-init.sh:/etc/cont-init.d/10-office-llm:ro
      - ./skills/vector:/opt/data/skills/vector:ro
    command: ["gateway", "run"]

  hermes-cluster-gpu:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3}
    restart: unless-stopped
    networks:
      - office
    depends_on:
      - office-gateway
    env_file:
      - ./hermes/cluster-gpu/.env
      - ./models.env
    environment:
      HERMES_HOME: /opt/data
      OFFICE_GATEWAY_URL: http://office-gateway:8080
      HERMES_API_TIMEOUT: "60"
      A2A_REPLY_TIMEOUT: "90"
    volumes:
      - hermes_cluster_gpu_data:/opt/data
      - ./hermes/cluster-gpu/config.yaml:/opt/hermes-config.template.yaml:ro
      - ./scripts/apply-office-llm-config.py:/opt/office/apply-office-llm-config.py:ro
      - ./scripts/hermes-office-llm-cont-init.sh:/etc/cont-init.d/10-office-llm:ro
      - ./skills/cluster-gpu:/opt/data/skills/cluster-gpu:ro
    command: ["gateway", "run"]

  hermes-llm-edge:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3}
    restart: unless-stopped
    networks:
      - office
    depends_on:
      - office-gateway
    env_file:
      - ./hermes/llm-edge/.env
      - ./models.env
    environment:
      HERMES_HOME: /opt/data
      OFFICE_GATEWAY_URL: http://office-gateway:8080
      HERMES_API_TIMEOUT: "60"
      A2A_REPLY_TIMEOUT: "90"
    volumes:
      - hermes_llm_edge_data:/opt/data
      - ./hermes/llm-edge/config.yaml:/opt/hermes-config.template.yaml:ro
      - ./scripts/apply-office-llm-config.py:/opt/office/apply-office-llm-config.py:ro
      - ./scripts/hermes-office-llm-cont-init.sh:/etc/cont-init.d/10-office-llm:ro
      - ./skills/llm-edge:/opt/data/skills/llm-edge:ro
    command: ["gateway", "run"]

  hermes-obs:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.3}
    restart: unless-stopped
    networks:
      - office
    depends_on:
      - office-gateway
    env_file:
      - ./hermes/obs/.env
      - ./models.env
    environment:
      HERMES_HOME: /opt/data
      OFFICE_GATEWAY_URL: http://office-gateway:8080
      HERMES_API_TIMEOUT: "60"
      A2A_REPLY_TIMEOUT: "90"
    volumes:
      - hermes_obs_data:/opt/data
      - ./hermes/obs/config.yaml:/opt/hermes-config.template.yaml:ro
      - ./scripts/apply-office-llm-config.py:/opt/office/apply-office-llm-config.py:ro
      - ./scripts/hermes-office-llm-cont-init.sh:/etc/cont-init.d/10-office-llm:ro
      - ./skills/obs:/opt/data/skills/obs:ro
    command: ["gateway", "run"]

  office-console:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - office-gateway
      - hermes-agent
    env_file:
      - .env
    environment:
      NGINX_ENVSUBST_FILTER: OFFICE_GATEWAY_TOKEN_SUPERVISOR
    ports:
      - "${HERMES_CONSOLE_PUBLISH:-10.216.4.80:80}:80"
    volumes:
      - ./console/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./console/www:/usr/share/nginx/html:ro
      - ./assets/avatars:/avatars:ro
    networks:
      - office
