name: office

networks:
  office:
    driver: bridge

volumes:
  office_gateway_data:
  hermes_supervisor_data:
  kanban_data:
  hermes_lab_host_data:
  hermes_vector_data:
  hermes_cluster_gpu_data:
  hermes_llm_edge_data:
  hermes_obs_data:

services:
  office-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile.office-gateway
    image: office-gw:local
    restart: unless-stopped
    networks:
      - office
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - office_gateway_data:/var/lib/hermes-office-gateway
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Uncomment when cluster-gpu reads are configured:
      # - ${OFFICE_KUBECONFIG}:/etc/office/kubeconfig:ro
    environment:
      OFFICE_GATEWAY_BIND_HOST: 0.0.0.0
      OFFICE_GATEWAY_PORT: "8080"
      OFFICE_GATEWAY_DB_PATH: /var/lib/hermes-office-gateway/gateway.db

  hermes-agent:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    networks:
      - office
    depends_on:
      - office-gateway
      - hermes-lab-host
      - hermes-vector
      - hermes-cluster-gpu
      - hermes-llm-edge
      - hermes-obs
    ports:
      - "${HERMES_DASHBOARD_PUBLISH:-10.216.4.80:9119}:9119"
    env_file:
      - .env
      - ./hermes/supervisor/.env
    environment:
      HERMES_HOME: /opt/data
      A2A_HOST: 0.0.0.0
      A2A_PORT: "9900"
      OFFICE_GATEWAY_URL: http://office-gateway:8080
      OFFICE_GATEWAY_TOKEN: ${OFFICE_GATEWAY_TOKEN_SUPERVISOR}
    volumes:
      - hermes_supervisor_data:/opt/data
      - kanban_data:/opt/data/kanban
      - ./hermes/supervisor/config.yaml:/opt/data/config.yaml:ro
      - ./skills/supervisor:/opt/data/skills/supervisor:ro
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open"]

  hermes-lab-host:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    networks:
      - office
    depends_on:
      - office-gateway
    env_file:
      - .env
    environment:
      HERMES_HOME: /opt/data
      A2A_HOST: 0.0.0.0
      A2A_PORT: "9900"
      A2A_TOKEN: ${A2A_TOKEN_LAB_HOST}
      OFFICE_GATEWAY_URL: http://office-gateway:8080
      OFFICE_GATEWAY_TOKEN: ${OFFICE_GATEWAY_TOKEN_LAB_HOST}
    volumes:
      - hermes_lab_host_data:/opt/data
      - ./hermes/lab-host/config.yaml:/opt/data/config.yaml:ro
      - ./skills/lab-host:/opt/data/skills/lab-host:ro
    command: ["gateway", "run"]

  hermes-vector:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    networks:
      - office
    depends_on:
      - office-gateway
    env_file:
      - .env
    environment:
      HERMES_HOME: /opt/data
      A2A_HOST: 0.0.0.0
      A2A_PORT: "9900"
      A2A_TOKEN: ${A2A_TOKEN_VECTOR}
      OFFICE_GATEWAY_URL: http://office-gateway:8080
      OFFICE_GATEWAY_TOKEN: ${OFFICE_GATEWAY_TOKEN_VECTOR}
    volumes:
      - hermes_vector_data:/opt/data
      - ./hermes/vector/config.yaml:/opt/data/config.yaml:ro
      - ./skills/vector:/opt/data/skills/vector:ro
    command: ["gateway", "run"]

  hermes-cluster-gpu:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    networks:
      - office
    depends_on:
      - office-gateway
    env_file:
      - .env
    environment:
      HERMES_HOME: /opt/data
      A2A_HOST: 0.0.0.0
      A2A_PORT: "9900"
      A2A_TOKEN: ${A2A_TOKEN_CLUSTER_GPU}
      OFFICE_GATEWAY_URL: http://office-gateway:8080
      OFFICE_GATEWAY_TOKEN: ${OFFICE_GATEWAY_TOKEN_CLUSTER}
    volumes:
      - hermes_cluster_gpu_data:/opt/data
      - ./hermes/cluster-gpu/config.yaml:/opt/data/config.yaml:ro
      - ./skills/cluster-gpu:/opt/data/skills/cluster-gpu:ro
    command: ["gateway", "run"]

  hermes-llm-edge:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    networks:
      - office
    depends_on:
      - office-gateway
    env_file:
      - .env
    environment:
      HERMES_HOME: /opt/data
      A2A_HOST: 0.0.0.0
      A2A_PORT: "9900"
      A2A_TOKEN: ${A2A_TOKEN_LLM_EDGE}
      OFFICE_GATEWAY_URL: http://office-gateway:8080
      OFFICE_GATEWAY_TOKEN: ${OFFICE_GATEWAY_TOKEN_LLM}
    volumes:
      - hermes_llm_edge_data:/opt/data
      - ./hermes/llm-edge/config.yaml:/opt/data/config.yaml:ro
      - ./skills/llm-edge:/opt/data/skills/llm-edge:ro
    command: ["gateway", "run"]

  hermes-obs:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    networks:
      - office
    depends_on:
      - office-gateway
    env_file:
      - .env
    environment:
      HERMES_HOME: /opt/data
      A2A_HOST: 0.0.0.0
      A2A_PORT: "9900"
      A2A_TOKEN: ${A2A_TOKEN_OBS}
      OFFICE_GATEWAY_URL: http://office-gateway:8080
      OFFICE_GATEWAY_TOKEN: ${OFFICE_GATEWAY_TOKEN_OBS}
    volumes:
      - hermes_obs_data:/opt/data
      - ./hermes/obs/config.yaml:/opt/data/config.yaml:ro
      - ./skills/obs:/opt/data/skills/obs:ro
    command: ["gateway", "run"]
