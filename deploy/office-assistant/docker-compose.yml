# Air-gapped friendly compose: images must already exist on the VM.
# Build/pull on a networked PC with scripts/export-images.sh, then
# scripts/load-images.sh on the VM. Never pulls from registries here.

services:
  office-gateway:
    image: ${OFFICE_GATEWAY_IMAGE:-hermes-office-gateway:1.0.0}
    platform: ${OFFICE_IMAGE_PLATFORM:-linux/amd64}
    pull_policy: never
    restart: unless-stopped
    environment:
      OFFICE_GATEWAY_TOKEN: ${OFFICE_GATEWAY_TOKEN}
      OFFICE_SERVICE_URLS: ${OFFICE_SERVICE_URLS}
      OFFICE_WRITE_TARGETS: ${OFFICE_WRITE_TARGETS:-}
      OFFICE_SCALE_BOUNDS: ${OFFICE_SCALE_BOUNDS:-}
      OFFICE_ADAPTER_ENDPOINTS: ${OFFICE_ADAPTER_ENDPOINTS:-}
      OFFICE_ACTION_TTL_SECONDS: ${OFFICE_ACTION_TTL_SECONDS:-600}
      OFFICE_GATEWAY_DB_PATH: ${OFFICE_GATEWAY_DB_PATH:-/var/lib/hermes-office-gateway/gateway.db}
      OFFICE_GATEWAY_BIND_HOST: 0.0.0.0
      OFFICE_GATEWAY_PORT: "8080"
      OFFICE_HOST_ENABLED: ${OFFICE_HOST_ENABLED:-1}
      OFFICE_DOCKER_SOCK: ${OFFICE_DOCKER_SOCK:-/var/run/docker.sock}
      OFFICE_HOST_PROC: /host/proc
      OFFICE_HOST_ROOT: /host/root
      OFFICE_HOST_CPU_CRITICAL: ${OFFICE_HOST_CPU_CRITICAL:-90}
      OFFICE_HOST_MEMORY_CRITICAL: ${OFFICE_HOST_MEMORY_CRITICAL:-90}
      OFFICE_HOST_DISK_CRITICAL: ${OFFICE_HOST_DISK_CRITICAL:-90}
    volumes:
      - office_gateway_data:/var/lib/hermes-office-gateway
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /:/host/root:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Internal only — Hermes reaches it on the compose network.
    # Do not publish 8080; host :8000 is already Attu.
    expose:
      - "8080"
    networks:
      - office

  hermes-agent:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    platform: ${OFFICE_IMAGE_PLATFORM:-linux/amd64}
    pull_policy: never
    restart: unless-stopped
    # Official image: CLI is the default CMD and exits without a TTY.
    # `gateway run` keeps s6 + dashboard alive in the background.
    command: ["gateway", "run"]
    depends_on:
      - office-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: ${HERMES_DASHBOARD_HOST:-0.0.0.0}
      HERMES_DASHBOARD_PORT: ${HERMES_DASHBOARD_PORT:-9119}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-${HERMES_DASHBOARD_USERNAME:-office-admin}}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-${HERMES_DASHBOARD_PASSWORD}}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://10.216.221.100/llm/v1}
      LITELLM_MODEL: ${LITELLM_MODEL:-qwen3.5-fast}
      OFFICE_GATEWAY_URL: http://office-gateway:8080
      OFFICE_GATEWAY_TOKEN: ${OFFICE_GATEWAY_TOKEN}
    ports:
      - "${HERMES_DASHBOARD_PUBLISH:-10.216.4.80:9119}:9119"
    volumes:
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
      - ./hermes/.env:/opt/data/.env:ro
      - ./skills/office-platform:/opt/data/skills/office-platform:ro
      - hermes_data:/opt/data/state
    networks:
      - office

  dashboard-proxy:
    image: ${DASHBOARD_PROXY_IMAGE:-nginx:1.27-alpine}
    platform: ${OFFICE_IMAGE_PLATFORM:-linux/amd64}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - hermes-agent
    ports:
      - "${HERMES_DASHBOARD_HTTP_PUBLISH:-10.216.4.80:80}:80"
    volumes:
      - ./nginx/dashboard-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - office

volumes:
  office_gateway_data:
  hermes_data:

networks:
  office:
    driver: bridge
