    networks:
      - office

  office-edge:
    image: traefik:v3.3
    restart: unless-stopped
    depends_on:
      - office-gateway
      - hermes-agent
      - hermes-lab-host
      - hermes-vector
      - hermes-cluster-gpu
      - hermes-llm-edge
      - hermes-obs
      - hermes-edge
      - office-www
