      - "${HERMES_CONSOLE_TLS_PUBLISH:-10.216.4.80:443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./edge/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./edge/traefik-dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    networks:
      - office
