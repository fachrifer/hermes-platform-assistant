name: office

networks:
  office:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.80.0/24

volumes:
  office_gateway_data:
  hermes_supervisor_v2:
  hermes_lab_host_v2:
  hermes_ingress_v2:
  hermes_llm_v2:
  hermes_cluster_gpu_v2:
  hermes_vector_v2:
  hermes_obs_v2:

# Lab has no internet. Public DNS waits ~5 minutes on TCP SYN retries
# during Dashboard "forging session" / tool check_fn. Loopback refuses immediately.
x-hermes-airgap-hosts: &hermes-airgap-hosts
  - "models.dev:127.0.0.1"
  - "api.github.com:127.0.0.1"
  - "github.com:127.0.0.1"
  - "raw.githubusercontent.com:127.0.0.1"
  - "registry.npmjs.org:127.0.0.1"
  - "portal.nousresearch.com:127.0.0.1"
  - "openrouter.ai:127.0.0.1"
  - "pypi.org:127.0.0.1"
  - "files.pythonhosted.org:127.0.0.1"

# Any other outbound call hits a dead proxy and fails at once. httpx ignores CIDR
# entries in NO_PROXY, so the Lab servers are listed by IP.
x-hermes-env: &hermes-env
  HERMES_HOME: /opt/data
  TZ: Asia/Jakarta
  HERMES_DASHBOARD: "1"
  HERMES_DASHBOARD_HOST: "0.0.0.0"
  HERMES_DASHBOARD_PORT: "9119"
  HERMES_DASHBOARD_TUI: "1"
  # Desktop WS behind Traefik: peer IP is office-edge, not the laptop.
  HERMES_DASHBOARD_TRUST_LAN: "1"
  HERMES_DASHBOARD_USERNAME: ${HERMES_DASHBOARD_USERNAME:-}
  HERMES_DASHBOARD_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:-}
  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USERNAME:-}
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:-}
  HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
  HERMES_DASHBOARD_SESSION_TOKEN: ${HERMES_DASHBOARD_SESSION_TOKEN:-}
  API_SERVER_ENABLED: "true"
  API_SERVER_HOST: "0.0.0.0"
  API_SERVER_PORT: "8642"
  HTTPS_PROXY: http://127.0.0.1:9
  HTTP_PROXY: http://127.0.0.1:9
  https_proxy: http://127.0.0.1:9
  http_proxy: http://127.0.0.1:9
  NO_PROXY: &no-proxy localhost,127.0.0.1,10.216.4.80,10.216.221.100,10.216.203.132,10.216.78.129,10.216.78.130,office-gateway,hermes-agent,hermes-lab-host,hermes-ingress,hermes-llm,hermes-cluster-gpu,hermes-vector,hermes-obs
  no_proxy: *no-proxy

x-hermes-agent: &hermes-agent
  image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.9.21}
  restart: unless-stopped
  networks:
    - office
  depends_on:
    - office-gateway
  extra_hosts: *hermes-airgap-hosts
  command: ["gateway", "run"]

services:
  office-gateway-init:
    image: busybox:1.36
    restart: "no"
    volumes:
      - office_gateway_data:/var/lib/hermes-office-gateway
      - ${OFFICE_KUBECONFIG:-./kubeconfig.absent}:/etc/office/kubeconfig:ro
    command:
      - sh
      - -c
      - |
        chown -R 10001:10001 /var/lib/hermes-office-gateway
        if [ -s /etc/office/kubeconfig ]; then
          cp /etc/office/kubeconfig /var/lib/hermes-office-gateway/kubeconfig
          chown 10001:10001 /var/lib/hermes-office-gateway/kubeconfig
          chmod 0640 /var/lib/hermes-office-gateway/kubeconfig
        fi

  office-gateway:
    build:
      context: ${OFFICE_GATEWAY_CONTEXT:-../..}
      dockerfile: Dockerfile.office-gateway
    image: office-gw:local
    restart: unless-stopped
    depends_on:
      office-gateway-init:
        condition: service_completed_successfully
    group_add:
      - "${DOCKER_GID:-998}"
    networks:
      - office
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - office_gateway_data:/var/lib/hermes-office-gateway
      # Live Python package so a code-only ship needs no image rebuild.
      # Lab .env: OFFICE_GATEWAY_CONTEXT=.  Laptop: ../..
      - ${OFFICE_GATEWAY_CONTEXT:-../..}/office_gateway:/app/office_gateway:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${OFFICE_DBUS_SOCKET:-/run/dbus/system_bus_socket}:/run/dbus/system_bus_socket:ro
      - ./edge:/edge:rw
      - ./certs:/certs:ro
    environment:
      OFFICE_GATEWAY_BIND_HOST: 0.0.0.0
      OFFICE_GATEWAY_PORT: "8080"
      OFFICE_GATEWAY_DB_PATH: /var/lib/hermes-office-gateway/gateway.db
      KUBECONFIG: /var/lib/hermes-office-gateway/kubeconfig
      OFFICE_EDGE_ROUTES_PATH: /edge/edge-routes
      OFFICE_EDGE_DYNAMIC_PATH: /edge/traefik-dynamic/routes.yml
      OFFICE_EDGE_LOCATIONS_PATH: /edge/traefik-dynamic/routes.yml
      OFFICE_EDGE_BACKUP_DIR: /edge/backups
      OFFICE_EDGE_TLS_CERT_PATH: /certs/tls.crt
      OFFICE_CONSOLE_URL: https://${HERMES_CONSOLE_TLS_HOST:-10.216.4.80}

  hermes-agent:
    <<: *hermes-agent
    depends_on:
      - office-gateway
      - hermes-lab-host
      - hermes-ingress
      - hermes-llm
      - hermes-cluster-gpu
      - hermes-vector
      - hermes-obs
    ports:
      - "${HERMES_DASHBOARD_PUBLISH:-10.216.4.80:9119}:9119"
    env_file:
      - ./models.env
      - ./hermes/supervisor/.env
    environment:
      <<: *hermes-env
      # Desktop Test hits public /api/status then /api/ws. WS Origin must match
      # this published URL (bind is 0.0.0.0). Do not reuse specialist /bots/ URLs.
      HERMES_DASHBOARD_PUBLIC_URL: http://${HERMES_DASHBOARD_PUBLISH:-10.216.4.80:9119}
    volumes:
      - hermes_supervisor_v2:/opt/data
      - ./hermes/supervisor/config.yaml:/opt/data/config.yaml:ro
      - ./skills/supervisor:/opt/data/skills/office-supervisor:ro
      - ./scripts/hermes-cli-symlink-cont-init.sh:/etc/cont-init.d/08-hermes-cli:ro
      - ./scripts/hermes-bot-mode-marker-cont-init.sh:/etc/cont-init.d/30-bot-mode-marker:ro

  hermes-lab-host:
    <<: *hermes-agent
    ports:
      - "${HERMES_BOT_BIND:-10.216.4.80}:9121:9119"
    env_file:
      - ./models.env
      - ./hermes/lab-host/.env
    environment:
      <<: *hermes-env
      HERMES_DASHBOARD_PUBLIC_URL: http://${HERMES_BOT_BIND:-10.216.4.80}:9121
    volumes:
      - hermes_lab_host_v2:/opt/data
      - ./hermes/lab-host/config.yaml:/opt/data/config.yaml:ro
      - ./skills/lab-host:/opt/data/skills/office-lab-host:ro
      - ./scripts/hermes-cli-symlink-cont-init.sh:/etc/cont-init.d/08-hermes-cli:ro
      - ./scripts/hermes-bot-mode-marker-cont-init.sh:/etc/cont-init.d/30-bot-mode-marker:ro

  hermes-vector:
    <<: *hermes-agent
    ports:
      - "${HERMES_BOT_BIND:-10.216.4.80}:9122:9119"
    env_file:
      - ./models.env
      - ./hermes/vector/.env
    environment:
      <<: *hermes-env
      HERMES_DASHBOARD_PUBLIC_URL: http://${HERMES_BOT_BIND:-10.216.4.80}:9122
    volumes:
      - hermes_vector_v2:/opt/data
      - ./hermes/vector/config.yaml:/opt/data/config.yaml:ro
      - ./skills/vector:/opt/data/skills/office-vector:ro
      - ./scripts/hermes-cli-symlink-cont-init.sh:/etc/cont-init.d/08-hermes-cli:ro
      - ./scripts/hermes-bot-mode-marker-cont-init.sh:/etc/cont-init.d/30-bot-mode-marker:ro

  hermes-cluster-gpu:
    <<: *hermes-agent
    ports:
      - "${HERMES_BOT_BIND:-10.216.4.80}:9123:9119"
    env_file:
      - ./models.env
      - ./hermes/cluster-gpu/.env
    environment:
      <<: *hermes-env
      HERMES_DASHBOARD_PUBLIC_URL: http://${HERMES_BOT_BIND:-10.216.4.80}:9123
    volumes:
      - hermes_cluster_gpu_v2:/opt/data
      - ./hermes/cluster-gpu/config.yaml:/opt/data/config.yaml:ro
      - ./skills/cluster-gpu:/opt/data/skills/office-cluster-gpu:ro
      - ./scripts/hermes-cli-symlink-cont-init.sh:/etc/cont-init.d/08-hermes-cli:ro
      - ./scripts/hermes-bot-mode-marker-cont-init.sh:/etc/cont-init.d/30-bot-mode-marker:ro

  hermes-llm:
    <<: *hermes-agent
    ports:
      - "${HERMES_BOT_BIND:-10.216.4.80}:9124:9119"
    env_file:
      - ./models.env
      - ./hermes/llm/.env
    environment:
      <<: *hermes-env
      HERMES_DASHBOARD_PUBLIC_URL: http://${HERMES_BOT_BIND:-10.216.4.80}:9124
    volumes:
      - hermes_llm_v2:/opt/data
      - ./hermes/llm/config.yaml:/opt/data/config.yaml:ro
      - ./skills/llm:/opt/data/skills/office-llm:ro
      - ./scripts/hermes-cli-symlink-cont-init.sh:/etc/cont-init.d/08-hermes-cli:ro
      - ./scripts/hermes-bot-mode-marker-cont-init.sh:/etc/cont-init.d/30-bot-mode-marker:ro

  hermes-obs:
    <<: *hermes-agent
    ports:
      - "${HERMES_BOT_BIND:-10.216.4.80}:9125:9119"
    env_file:
      - ./models.env
      - ./hermes/obs/.env
    environment:
      <<: *hermes-env
      HERMES_DASHBOARD_PUBLIC_URL: http://${HERMES_BOT_BIND:-10.216.4.80}:9125
    volumes:
      - hermes_obs_v2:/opt/data
      - ./hermes/obs/config.yaml:/opt/data/config.yaml:ro
      - ./skills/obs:/opt/data/skills/office-obs:ro
      - ./scripts/hermes-cli-symlink-cont-init.sh:/etc/cont-init.d/08-hermes-cli:ro
      - ./scripts/hermes-bot-mode-marker-cont-init.sh:/etc/cont-init.d/30-bot-mode-marker:ro

  hermes-ingress:
    <<: *hermes-agent
    ports:
      - "${HERMES_BOT_BIND:-10.216.4.80}:9126:9119"
    env_file:
      - ./models.env
      - ./hermes/ingress/.env
    environment:
      <<: *hermes-env
      HERMES_DASHBOARD_PUBLIC_URL: http://${HERMES_BOT_BIND:-10.216.4.80}:9126
    volumes:
      - hermes_ingress_v2:/opt/data
      - ./hermes/ingress/config.yaml:/opt/data/config.yaml:ro
      - ./skills/ingress:/opt/data/skills/office-ingress:ro
      - ./scripts/hermes-cli-symlink-cont-init.sh:/etc/cont-init.d/08-hermes-cli:ro
      - ./scripts/hermes-bot-mode-marker-cont-init.sh:/etc/cont-init.d/30-bot-mode-marker:ro

  office-www:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Internal only - browsers reach Athena via office-edge (Traefik).
    expose:
      - "80"
    volumes:
      - ./console/www:/usr/share/nginx/html:ro
      - ./console/www-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./assets/avatars:/avatars:ro
    networks:
      - office

  office-edge:
    image: traefik:v3.3
    restart: unless-stopped
    depends_on:
      - office-gateway
      - hermes-agent
      - hermes-lab-host
      - hermes-ingress
      - hermes-llm
      - hermes-cluster-gpu
      - hermes-vector
      - hermes-obs
      - office-www
    ports:
      - "${HERMES_CONSOLE_PUBLISH:-10.216.4.80:80}:80"
      - "${HERMES_CONSOLE_TLS_PUBLISH:-10.216.4.80:443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./edge/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./edge/traefik-dynamic:/etc/traefik/dynamic:ro
      - ./edge/approvers.htpasswd:/etc/traefik/approvers.htpasswd:ro
      - ./certs:/certs:ro
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    networks:
      - office
