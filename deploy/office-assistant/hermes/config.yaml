# Hermes reads THIS file for model routing — not the compose .env.
# ${VAR} is expanded from /opt/data/.env and container environment.

model:
  default: ${LITELLM_MODEL}
  provider: custom
  base_url: ${LITELLM_BASE_URL}
  api_key: ${OPENAI_API_KEY}

custom_providers:
  - name: office-inference
    base_url: ${LITELLM_BASE_URL}
    api_key: ${OPENAI_API_KEY}

dashboard:
  enabled: true
