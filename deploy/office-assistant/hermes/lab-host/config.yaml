# Lab-host specialist — Docker inspect and Lab container restarts.
agent:
  name: lab-host

model:
  provider: custom
  default: gpt-4o
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}

gateway:
  platforms:
    a2a:
      enabled: true
      extra:
        port: 9900

# Star topology: specialists do not list outbound A2A peers.
