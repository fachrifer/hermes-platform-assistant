<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermes Office</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e7ecf1;
      --muted: #9aa7b5;
      --accent: #3d8bfd;
      --ok: #3dd68c;
      --bad: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1d2a3a 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    main { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    h1 { font-size: 1.75rem; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin-bottom: 1.75rem; }
    section {
      background: color-mix(in srgb, var(--panel) 92%, white 8%);
      border: 1px solid #2a3542;
      border-radius: 12px;
      padding: 1rem 1.1rem;
      margin-bottom: 1rem;
    }
    h2 { font-size: 1rem; margin: 0 0 0.75rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
    ul { margin: 0; padding-left: 1.1rem; }
    li { margin: 0.25rem 0; }
    pre {
      white-space: pre-wrap;
      background: #10161d;
      border-radius: 8px;
      padding: 0.75rem;
      overflow-x: auto;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.85rem;
    }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Hermes Office</h1>
    <p class="sub">CML monitor &amp; report — logs stay local; Cloud gets report + recommendation only.</p>

    <section>
      <h2>Service health</h2>
      {{HEALTH}}
    </section>

    <section>
      <h2>Latest report / recommendation</h2>
      {{LATEST}}
    </section>

    <section>
      <h2>Recent reports</h2>
      {{REPORTS}}
    </section>

    <section>
      <h2>Recent logs (local)</h2>
      {{LOGS}}
    </section>
  </main>
</body>
</html>
