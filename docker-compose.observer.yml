services:
  office-observer:
    build:
      context: .
      dockerfile: Dockerfile.observer
    image: hermes-office-observer:latest
    container_name: hermes-office-observer
    env_file: "${OFFICE_OBSERVER_ENV_FILE:-deploy/observer.env}"
    volumes:
      - "${OFFICE_OBSERVER_STATE_DIR:?set OFFICE_OBSERVER_STATE_DIR}:/var/lib/hermes-observer"
      - "${OFFICE_OBSERVER_CERT_DIR:?set OFFICE_OBSERVER_CERT_DIR}:/certs:ro"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
